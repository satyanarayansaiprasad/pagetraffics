    <script type="text/javascript">
      /* Gsap Registration and confing */
      gsap.config({
        autoSleep: 60,
        nullTargetWarn: false,
      });

      $(window).on("beforeunload", function () {
        $(window).scrollTop(0);
      });

      gsap.registerPlugin(ScrollTrigger, TextPlugin, MotionPathPlugin);

      function preventScroll(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      $(document).ready(function () {
        const lenis = new Lenis({
          smoothWheel: true,
          duration: 2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        gsap.set("[design-page]", {
          autoAlpha: 0,
          y: 60,
        });
        gsap.set("[hero-load]", {
          autoAlpha: 0,
          y: 60,
        });
        const pw = document.querySelector(".page-wrapper");
        if (pw) {
          pw.addEventListener("wheel", preventScroll);
        }
        setTimeout(function () {
          if (pw) {
            pw.removeEventListener("wheel", preventScroll);
          }
          ScrollTrigger.batch("[hero-load]", {
            onEnter: (elements) => {
              gsap.fromTo(
                elements,
                {
                  autoAlpha: 0,
                  y: 60,
                },
                {
                  autoAlpha: 1,
                  y: 0,
                  stagger: 0.2,
                  ease: "back.out",
                }
              );
            },
            once: true,
            start: "top 95%",
            end: "bottom 50%",
          });

          ScrollTrigger.batch("[design-page]", {
            onEnter: (elements) => {
              gsap.fromTo(
                elements,
                {
                  autoAlpha: 0,
                  y: 60,
                },
                {
                  autoAlpha: 1,
                  y: 0,
                  stagger: 0.2,
                  ease: "sine.out",
                }
              );
            },
            once: true,
            start: "top 95%",
            end: "bottom 50%",
          });
        }, 2000);
      });
    </script>
